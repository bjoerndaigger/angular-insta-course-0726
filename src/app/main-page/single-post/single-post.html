<article>
    <h2>{{ postInput().name }}</h2>
    <img [src]="postInput().img" [alt]="postInput().name + ' Image'">
    <p>{{ postInput().likes }} Likes</p>

    <button type="button" (click)="toggleLike(postInput())">
        @if (postInput().isLiked) {
        <img src="images/heart-red.png">
        } @else {
        <img src="images/heart-black.png">
        }
    </button>

    <h3>Comments:</h3>
    <input [formField]="commentInput" />
    <button type="button" (click)="addComment()" [disabled]="!commentInput().value()">Send</button>
</article>
